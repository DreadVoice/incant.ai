spring.application.name=incant

spring.datasource.url=jdbc:sqlite:${INCANT_DB_PATH:./data/incant.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# Spring Data JPA ships no SQLite dialect; it lives in hibernate-community-dialects
# and must be named explicitly or Hibernate fails at startup while auto-detecting.
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
