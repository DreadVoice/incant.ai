spring.application.name=incant

spring.datasource.url=jdbc:sqlite:${INCANT_DB_PATH:./data/incant.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# Spring Data JPA ships no SQLite dialect; it lives in hibernate-community-dialects
# and must be named explicitly or Hibernate fails at startup while auto-detecting.
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

incant.skills-path=${INCANT_SKILLS_PATH:./skills}
incant.provider=${INCANT_PROVIDER:anthropic}
incant.max-iterations=10

incant.providers.anthropic.api-key=${ANTHROPIC_API_KEY:}
incant.providers.anthropic.model=${INCANT_ANTHROPIC_MODEL:claude-opus-5}
incant.providers.anthropic.base-url=${INCANT_ANTHROPIC_BASE_URL:}

incant.providers.openai.api-key=${OPENAI_API_KEY:}
incant.providers.openai.model=${INCANT_OPENAI_MODEL:gpt-4o-mini}
incant.providers.openai.base-url=${INCANT_OPENAI_BASE_URL:}

incant.providers.ollama.model=${INCANT_OLLAMA_MODEL:incant-qwen}
incant.providers.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
incant.providers.ollama.auto-install=${INCANT_OLLAMA_AUTO_INSTALL:true}
